<!DOCTYPE html>
<html lang="pt">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5S4PN2FK3E"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-5S4PN2FK3E');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SALYA — Gestão moderna de folha de pagamento em Angola." />
    <meta name="theme-color" content="#9333ea" />

    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SALYA" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <title>SALYA — Folha de Pagamento</title>
    <link rel="icon" href="/logo.png" />

    <!-- Preload critical fonts to prevent FOUC -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" as="style" />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" as="style" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Prevent FOUC: hide root until fonts are ready, show splash screen -->
    <style>
      html { background: #0f172a; }
      #root {
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      #root.fonts-ready {
        opacity: 1;
      }
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-size: 24px;
        font-weight: normal;
        font-style: normal;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
        visibility: hidden;
      }
      .fonts-loaded .material-symbols-outlined {
        visibility: visible;
      }
      #salya-splash {
        position: fixed;
        inset: 0;
        background: #0f172a;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        transition: opacity 0.3s ease;
      }
      #salya-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #salya-splash img {
        height: 52px;
        width: auto;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.7; transform: scale(0.97); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen -->
    <div id="salya-splash">
      <img src="/logo.png" alt="Salya" />
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      function revealApp() {
        document.documentElement.classList.add('fonts-loaded');
        var root = document.getElementById('root');
        if (root) root.classList.add('fonts-ready');
        var splash = document.getElementById('salya-splash');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(function() { splash.remove(); }, 350);
        }
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(revealApp);
      } else {
        setTimeout(revealApp, 800);
      }
      setTimeout(revealApp, 2000);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.log('ServiceWorker error:', err);
          });
        });
      }
    </script>
  </body>
</html>
